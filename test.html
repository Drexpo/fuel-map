<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fuel Map PRO · route filter + mini analytics</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
/* ===== Layout ===== */
:root{--bg:#09111f;--panel:#10192d;--panel2:#16233e;--line:#2b3b60;--text:#eef4ff;--muted:#a7b5d4;--good:#1dd75f;--mid:#ffb340;--bad:#ff556d;--accent:#57a1ff;}
*{box-sizing:border-box} html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{display:grid;grid-template-columns:500px 1fr} #map{height:100vh;width:100%}
.side{overflow:auto;padding:18px;border-right:1px solid var(--line);background:linear-gradient(180deg,#0e182b 0%,#09111f 100%)}
.card{background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 10px 35px rgba(0,0,0,.25)}
.h1{font-size:28px;font-weight:900;margin:0 0 8px;line-height:1.08} .sub{color:var(--muted);font-size:13px;line-height:1.45;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px} .stat{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:11px}
.stat span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:6px} .stat b{font-size:20px}
.label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#0e172a;color:var(--text);outline:none}
input[type="range"]{padding:0;accent-color:var(--accent)} .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px} button{border:1px solid var(--line);background:#0f1930;color:var(--text);border-radius:999px;padding:10px 12px;cursor:pointer;font-weight:800}
button.active{background:linear-gradient(180deg,#2462db 0%,#1949b2 100%);border-color:#5da1ff}
.range-line{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:3px}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:8px} .dot{width:12px;height:12px;display:inline-block;border-radius:999px;border:2px solid rgba(255,255,255,.85);margin-right:5px}
.list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 520px);overflow:auto} .item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:11px;cursor:pointer}
.item.active{border-color:#61a8ff;background:rgba(97,168,255,.10)} .item-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px} .brand{font-size:15px;font-weight:900} .price{font-size:18px;font-weight:900;white-space:nowrap} .meta{color:var(--muted);font-size:12px;line-height:1.38}
.pill{display:inline-block;margin-top:7px;border-radius:999px;padding:4px 8px;font-size:11px;border:1px solid rgba(255,255,255,.08)}
/* ===== Map markers ===== */
.marker{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;color:#fff;font-weight:900;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.aggregate-marker{
  min-width:48px;height:48px;padding:0 10px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  border:3px solid rgba(255,255,255,.95);
  color:#fff;font-weight:900;font-size:18px;
  background:#1f3470; box-shadow:0 6px 18px rgba(0,0,0,.35);
}

.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#10192d;color:var(--text);border:1px solid #30456f}
.popup h3{margin:0 0 10px;font-size:16px} .popup .p{color:var(--muted);font-size:12px;line-height:1.4;margin:4px 0} .popup .big{margin-top:8px;font-size:22px;font-weight:900}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.col{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px}
.col h4{margin:0 0 8px;font-size:14px}
.note{border-left:4px solid #ffb340;padding-left:10px;color:var(--muted);font-size:12px;line-height:1.45}
.poland-card{border-color:#3d5b95; background:linear-gradient(180deg, #13213b 0%, #182746 100%);}
.hidden{display:none}
.analytics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.analytics-cell{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px}
.analytics-cell span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.analytics-cell b{font-size:17px}
@media (max-width:1100px){body{grid-template-columns:1fr;grid-template-rows:auto 62vh} #map{height:62vh} .list{max-height:300px} .analytics-grid{grid-template-columns:repeat(2,1fr)}}

</style>
</head>
<body>
<aside class="side">
<div class="h1">Анализ заправок ЕС</div>
<div class="sub">Сравнение сетей E100 и Andamour.</div>

<section class="card">
<div class="stats">
<div class="stat"><span>Всего</span><b id="statAll"></b></div>
<div class="stat"><span>E/A</span><b id="statEA"></b></div>
<div class="stat"><span>Только E</span><b id="statE"></b></div>
<div class="stat"><span>Только A</span><b id="statA"></b></div>
</div>
<div class="legend">
<span><i class="dot" style="background:#1dd75f"></i>дешёвые</span>
<span><i class="dot" style="background:#ffb340"></i>средние</span>
<span><i class="dot" style="background:#ff556d"></i>дорогие</span>

</div>
<div class="sub" id="modeInfo" style="margin-top:10px;margin-bottom:0;"></div>
</section>

<section class="card">
<div class="label" style="margin-bottom:10px;">Мини-аналитика по выбранной стране</div>
<div class="analytics-grid">
  <div class="analytics-cell"><span>Заправок</span><b id="anaCount">—</b></div>
  <div class="analytics-cell"><span>Минимум</span><b id="anaMin">—</b></div>
  <div class="analytics-cell"><span>Средняя</span><b id="anaAvg">—</b></div>
  <div class="analytics-cell"><span>Максимум</span><b id="anaMax">—</b></div>
</div>
<div class="sub" id="anaCaption" style="margin-top:10px;margin-bottom:0;"></div>
</section>

<section class="card">
<label class="label">Поиск</label>
<input id="search" type="text" placeholder="Название, адрес, страна"/>
<div class="row">
<div><label class="label">Страна</label><select id="country"></select></div>
<div><label class="label">Сортировка</label><select id="sortBy">
<option value="priceAsc">Сначала дешёвые</option>
<option value="priceDesc">Сначала дорогие</option>
<option value="labelAsc">По названию A–Z</option>
</select></div>
</div>

<div style="margin-top:12px;">
<label class="label">Сеть</label>
<div class="btns">
<button class="src active" data-src="all">Все</button>
<button class="src" data-src="EA">E100/A</button>
<button class="src" data-src="E">E100</button>
<button class="src" data-src="A">Andamour</button>
</div>
</div>

<div style="margin-top:12px;">
<label class="label">Режим цветовой оценки</label>
<div class="btns">
<button class="cm active" data-cm="auto">Авто</button>
<button class="cm" data-cm="global">По всему ЕС</button>
<button class="cm" data-cm="country">Внутри страны</button>
</div>
<div class="sub" style="margin-top:8px;margin-bottom:0;"></div>
</div>
</section>

<section class="card" id="eurBlock">
<label class="label">Фильтр для евро-стран</label>
<input id="maxPriceEUR" type="range" step="0.0001">
<div class="range-line"><span id="eurMin"></span><span id="eurValue"></span></div>
<div class="sub" style="margin-top:8px;margin-bottom:0;">Фильтр для стран с EUR.</div>
</section>

<section class="card poland-card" id="plnBlock">
<label class="label">Фильтр для злотых (PLN)</label>
<input id="maxPricePLN" type="range" step="0.0001">
<div class="range-line"><span id="plnMin"></span><span id="plnValue"></span></div>
<div class="sub" style="margin-top:8px;margin-bottom:0;">Фильтр только для Польши.</div>
</section>

<section class="card">
<div class="btns" style="margin-top:0;">
<button class="quick active" data-mode="all">Все</button>
<button class="quick" data-mode="top10">TOP-10</button>
<button class="quick" data-mode="top20">TOP-20</button>
<button id="fitBtn">Показать всё</button>
<button id="resetBtn">Сброс</button>
</div>
<div class="note" style="margin-top:12px;">Фильтры и аналитика применяются к текущему отбору.</div>
</section>

<section class="card">
<div class="item-top" style="margin-bottom:10px;"><div class="brand">Точки в отборе</div><div class="meta"><span id="visibleCount"></span> шт.</div></div>
<div class="list" id="list"></div>
</section>
</aside>

<main id="map"></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

function sourceOk(r){ return state.src==='all' || r.type===state.src; }

  const e=(r.e ? `${r.e.label} ${r.e.address} ${r.e.road}` : '');
  const a=(r.a ? `${r.a.label} ${r.a.address} ${r.a.brand}` : '');

}

  const arr=scopeForColor().filter(r=>r.currency===currency).map(r=>r.price).sort((a,b)=>a-b);
  if(!arr.length) return {low: currency==='PLN' ? plnMin : eurMin, high: currency==='PLN' ? plnMax : eurMax};
  let lowQ=0.33, highQ=0.66;
  if(currency==='PLN'){ lowQ=0.25; highQ=0.50; }
  return {low:arr[Math.floor((arr.length-1)*lowQ)], high:arr[Math.floor((arr.length-1)*highQ)]};

function applyTop(arr){ const byPrice=[...arr].sort((a,b)=>a.price-b.price); if(state.mode==='all') return arr; const limit=state.mode==='top10'?10:20; if(byPrice.length<=limit) return byPrice; const boundary=byPrice[limit-1].price; return byPrice.filter(r=>r.price<=boundary+1e-9); }

    state.mode

  if (_filterCacheKey === key && _filterCacheValue) {

  const m = new Map();
  list.forEach(r => {
    if(!m.has(r.country)) m.set(r.country, []);
    m.get(r.country).push(r);
  });

  const lat = points.reduce((s,p)=>s+p.lat,0)/points.length;

  return [lat, lon];

}

      const icon = L.divIcon({

    document.getElementById('anaAvg').textContent='—';
    document.getElementById('anaMax').textContent='—';
    document.getElementById('anaCaption').textContent='Нет точек в текущем отборе.';
    return;
  }

  let caption = state.country !== 'all' ? `Страна: ${state.country}.` : 'Все страны.';
 

  if(state.country === 'Польша'){
    const prices = list.filter(r=>r.currency==='PLN').map(r=>r.price).sort((a,b)=>a-b);
    const avg = prices.reduce((a,b)=>a+b,0)/prices.length;
    document.getElementById('anaCount').textContent=prices.length;
    document.getElementById('anaMin').textContent=fmt(prices[0],'PLN');
    document.getElementById('anaAvg').textContent=fmt(avg,'PLN');
    document.getElementById('anaMax').textContent=fmt(prices[prices.length-1],'PLN');
    document.getElementById('anaCaption').textContent=caption + ' PLN.';
  } else {
    const prices = list.filter(r=>r.currency==='EUR').map(r=>r.price).sort((a,b)=>a-b);
    const avg = prices.reduce((a,b)=>a+b,0)/prices.length;
    document.getElementById('anaCount').textContent=prices.length;
    document.getElementById('anaMin').textContent=fmt(prices[0],'EUR');
    document.getElementById('anaAvg').textContent=fmt(avg,'EUR');
    document.getElementById('anaMax').textContent=fmt(prices[prices.length-1],'EUR');
    document.getElementById('anaCaption').textContent=caption + ' EUR.';
  }
}
function updateInterface(){
  document.getElementById('modeInfo').textContent='Цветовой режим: ' + modeLabel() + '.';
  document.getElementById('eurMin').textContent=eurMin.toFixed(4)+' EUR';
  document.getElementById('eurValue').textContent=Number(state.maxPriceEUR).toFixed(4)+' EUR';
  document.getElementById('plnMin').textContent=plnMin.toFixed(4)+' PLN';
  document.getElementById('plnValue').textContent=Number(state.maxPricePLN).toFixed(4)+' PLN';

  const eurBlock=document.getElementById('eurBlock');
  const plnBlock=document.getElementById('plnBlock');
  if(state.country==='Польша'){
    eurBlock.classList.add('hidden');
    plnBlock.classList.remove('hidden');
  } else if(state.country!=='all') {
    eurBlock.classList.remove('hidden');
    plnBlock.classList.add('hidden');
  } else {
    eurBlock.classList.remove('hidden');
    plnBlock.classList.remove('hidden');
  }
}
function render(autoFit=false){ updateInterface(); const list=getFiltered(); updateAnalytics(list); renderMarkers(list); renderList(list); if(autoFit) fitTo(list); }

/* ===== Event wiring ===== */
document.getElementById('country').innerHTML=`<option value="all">Все страны</option>`+countries.map(c=>`<option value="${c}">${c}</option>`).join('');
document.getElementById('maxPriceEUR').min=eurMin; document.getElementById('maxPriceEUR').max=eurMax; document.getElementById('maxPriceEUR').value=eurMax;
document.getElementById('maxPricePLN').min=plnMin; document.getElementById('maxPricePLN').max=plnMax; document.getElementById('maxPricePLN').value=plnMax;

document.getElementById('search').addEventListener('input',e=>{ state.search=e.target.value.trim().toLowerCase(); render(); });
document.getElementById('country').addEventListener('change',e=>{ state.country=e.target.value; render(true); });
document.getElementById('sortBy').addEventListener('change',e=>{ state.sortBy=e.target.value; render(); });
document.querySelectorAll('.src').forEach(btn=>btn.addEventListener('click',()=>{ state.src=btn.dataset.src; syncBtns(); render(true); }));
document.querySelectorAll('.cm').forEach(btn=>btn.addEventListener('click',()=>{ state.cm=btn.dataset.cm; syncBtns(); render(true); }));
document.getElementById('maxPriceEUR').addEventListener('input',e=>{ state.maxPriceEUR=Number(e.target.value); render(); });
document.getElementById('maxPricePLN').addEventListener('input',e=>{ state.maxPricePLN=Number(e.target.value); render(); });
document.querySelectorAll('.quick').forEach(btn=>btn.addEventListener('click',()=>{ document.querySelectorAll('.quick').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); state.mode=btn.dataset.mode; render(); }));
document.getElementById('fitBtn').addEventListener('click',()=>fitTo(getFiltered()));
document.getElementById('resetBtn').addEventListener('click',()=>{ state.search=''; state.country='all'; state.src='all'; state.cm='auto'; state.sortBy='priceAsc'; state.maxPriceEUR=eurMax; state.maxPricePLN=plnMax; state.mode='all'; state.activeId=null; _filterCacheKey=null; _filterCacheValue=null; document.getElementById('search').value=''; document.getElementById('country').value='all'; document.getElementById('sortBy').value='priceAsc'; document.getElementById('maxPriceEUR').value=eurMax; document.getElementById('maxPricePLN').value=plnMax; document.querySelectorAll('.quick').forEach(x=>x.classList.remove('active')); document.querySelector('.quick[data-mode="all"]').classList.add('active'); syncBtns(); render(true); });
map.on('zoomend', () => {
  if(currentRenderedList && currentRenderedList.length){
    renderMarkers(currentRenderedList);
  }
});
syncBtns();
map.fitBounds(L.latLngBounds(records.map(r=>[r.lat,r.lon])).pad(0.15));
render();
</script>
</body>
</html>
